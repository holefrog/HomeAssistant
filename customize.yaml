# =============================================================
# customize.yaml — 设备显示名称统一管理
#
# 用途：集中定义所有设备的 friendly_name，纳入 Git 版本控制。
#       重装 HA 不丢失，优先级高于 UI 手动设置。
#
# 引用方式（configuration.yaml）：
#   homeassistant:
#     customize: !include customize.yaml
#
# 命名规范：见 docs/naming_convention.md
# 最后更新：2026-10-17
# =============================================================


