# =============================================================
# automations/alarm.yaml
# 安防报警自动化集合
#
# 依赖 script：
#   - script.alarm_trigger_all  — 并行触发灯光+声音（scripts/security.yaml）
#   - script.alarm_clear_all    — 停止全部声光+置位 input_clear（scripts/security.yaml）
#
# 报警解除机制：
#   所有报警 automation 均以 input_boolean.input_clear 为退出条件。
#   input_boolean.input_clear 由 "Handle actionable notification" 统一置位，
#   60 秒后自动复位，为下次报警做准备。
#
# 布防条件：
#   所有报警均仅在 input_boolean.arm_alarm 为 on 时触发。
# =============================================================


# -------------------------------------------------------------
# 报警：门窗被打开（仅在离家布防模式下触发）
# -------------------------------------------------------------
- id: 'alarm_door_window_open'
  alias: 'Alarm_Door_Window_Open'
  description: '门窗被打开报警（仅在离家布防模式下触发）'
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.global_door_status
    attribute: count
  conditions:
  - condition: state
    entity_id: input_boolean.arm_alarm
    state: 'on'
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and trigger.to_state is not none and
         trigger.to_state.attributes.count | int(0) > trigger.from_state.attributes.count | int(0) }}
  actions:
  - action: script.alarm_notify_loop
    data:
      title: "⚠️ 门窗被打开报警！"
      message: >
        {% set lst = expand(label_entities('security_opening')) | selectattr('state', 'eq', 'on') | list %}
        {% if lst | count > 0 %}{% for s in lst %}{{ area_name(s.entity_id) or '未知区域' }}: {{ s.name }} 未关！
        {% endfor %}{% else %}检测到门窗打开，但未能获取具体传感器名称。{% endif %}
      clear_button_title: "✅ 点击解除报警 [门窗打开]"


# -------------------------------------------------------------
# 摄像机：楼梯间门打开时拍照录像（仅在离家布防模式下触发）
# -------------------------------------------------------------
- id: 'alarm_gun_safe_camera_record'
  alias: 'Alarm_Gun_Safe_Camera_Record'
  description: '枪柜门打开时开始连拍并保存（仅在离家布防模式下触发）'
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.stair_closet_camera_door_sensor
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.arm_alarm
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.input_clear
  - repeat:
      until:
      - condition: state
        entity_id: input_boolean.input_clear
        state: 'on'
      sequence:
      - variables:
          picname: gun-{{ now().strftime("%Y%m%d-%H%M%S") }}.jpg
      - delay:
          seconds: 1
      - action: camera.snapshot
        data:
          filename: /config/www/record/{{ picname }}
        target:
          entity_id: camera.stair_closet_camera
      - action: notify.group_phone
        data:
          title: "🚨 枪柜门被打开！"
          message: "枪柜门被打开！抓拍已生成。"
          data:
            tag: 'gun_safe_camera'
            persistent: true
            sticky: true
            image: /local/record/{{ picname }}
            actions:
            - action: CONFIRM_CLEAR
              title: "✅ 点击解除报警 [枪柜门打开]"
      - action: persistent_notification.create
        data:
          title: "🚨 枪柜门被打开！"
          notification_id: gun_safe_camera
          message: "枪柜门被打开，照片已抓拍：![抓拍](/local/record/{{ picname }})"
      - action: script.alarm_trigger_all
      - repeat:
          while:
          - condition: template
            value_template: '{{ repeat.index <= 29 }}'
          - condition: state
            entity_id: input_boolean.input_clear
            state: 'off'
          sequence:
          - variables:
              picname_loop: gun-{{ now().strftime("%Y%m%d-%H%M%S") }}.jpg
          - delay:
              seconds: 1
          - action: camera.snapshot
            data:
              filename: /config/www/record/{{ picname_loop }}
            target:
              entity_id: camera.stair_closet_camera


# -------------------------------------------------------------
# 报警：枪柜震动报警（仅在离家布防模式下触发）
# -------------------------------------------------------------
- id: 'alarm_gun_safe_opened'
  alias: 'Alarm_Gun_Safe_Opened'
  description: '枪柜内部震动报警（仅在离家布防模式下触发）'
  mode: restart
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.gun_safe_vibration_inside_sensor
    - binary_sensor.gun_safe_vibration_outside_sensor
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.arm_alarm
    state: 'on'
  actions:
  - action: script.alarm_notify_loop
    data:
      title: "🚨 枪柜震动报警！"
      message: "检测到枪柜受到震动，可能已被触碰或撬动！"
      clear_button_title: "✅ 点击解除报警 [枪柜震动]"


# -------------------------------------------------------------
# 报警：漏水或火灾报警 (随时触发，不设置条件)
# -------------------------------------------------------------
- id: 'alarm_water_leak_on_fire'
  alias: 'Alarm_Water_Leak_On_Fire'
  description: '漏水或火灾报警！！！'
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.global_water_leak_status
    attribute: count
    id: trigger_water
  - trigger: state
    entity_id: binary_sensor.global_fire_status
    attribute: count
    id: trigger_fire
  conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and trigger.to_state is not none and
         trigger.to_state.attributes.count | int(0) > trigger.from_state.attributes.count | int(0) }}
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: trigger_water
      sequence:
      - action: script.alarm_notify_loop
        data:
          title: "💧 漏水警报！"
          message: >
            {% set lst = expand(label_entities('security_leak')) | selectattr('state', 'in', ['on', 'On', 'ON', 'wet', 'Wet', 'WET']) | list %}
            {% if lst | count > 0 %}{% for s in lst %}{{ area_name(s.entity_id) or '未知区域' }}: {{ s.name }} 正在漏水！
            {% endfor %}{% else %}检测到漏水，但未能获取具体传感器名称。{% endif %}
          clear_button_title: "✅ 点击解除报警 [漏水]"
    - conditions:
      - condition: trigger
        id: trigger_fire
      sequence:
      - action: script.alarm_notify_loop
        data:
          title: "🔥 火灾警报！"
          message: '{{ state_attr("binary_sensor.global_fire_status", "Data") }}'
          clear_button_title: "✅ 点击解除报警 [火警]"




# -------------------------------------------------------------
# 辅助：处理手机端通知点击"解除报警"的操作
# -------------------------------------------------------------
- id: 'alarm_handle_actionable_notification'
  alias: 'Alarm_Handle_Actionable_Notification'
  description: '手机端点击解除报警动作或前端关闭通知后，清除报警状态'
  mode: restart
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: CONFIRM_CLEAR
  - trigger: event
    event_type: mobile_app_notification_cleared
    event_data:
      tag: security_alarm
  - trigger: event
    event_type: mobile_app_notification_cleared
    event_data:
      tag: gun_safe_camera
  - trigger: persistent_notification
    update_type: removed
    notification_id: security_alarm
  - trigger: persistent_notification
    update_type: removed
    notification_id: gun_safe_camera
  conditions: []
  actions:
  # 停止全部声光，置位 input_clear，触发各报警循环退出
  - action: script.alarm_clear_all
  - action: notify.group_phone
    data:
      title: "通知"
      message: "报警已被手动解除。"
  - action: persistent_notification.create
    data:
      title: "通知"
      message: "报警已被手动解除。"
  # 60 秒后复位 input_clear，为下次报警做准备
  - delay:
      seconds: 60
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.input_clear
